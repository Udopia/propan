name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc release
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF
          - name: clang release
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizers: OFF
          - name: gcc debug asan+ubsan
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizers: ON
          - name: clang debug asan+ubsan
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: ON
          - name: macos clang release
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizers: OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libarchive-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja libarchive

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          # Homebrew's libarchive is keg-only.
          CMAKE_PREFIX_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/libarchive' || '' }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPROPAN_WERROR=ON
          -DPROPAN_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build

      - name: Unit and application tests
        run: ctest --test-dir build --output-on-failure -LE integration

      - name: Integration tests
        # Sanitizer builds are several times slower; the integration tests are
        # tuned for release builds and do not add coverage over the unit tests.
        if: matrix.sanitizers == 'OFF'
        run: ctest --test-dir build --output-on-failure -L integration -j 4
        env:
          ASAN_OPTIONS: detect_leaks=0

      - name: Benchmark (informational)
        if: matrix.name == 'gcc release'
        run: python3 tests/benchmark.py --build build | tee $GITHUB_STEP_SUMMARY
